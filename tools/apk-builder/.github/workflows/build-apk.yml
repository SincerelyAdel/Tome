name: Build APK

# Builds an Android app (Flutter or Gradle) from another repo, only when
# asked: from Tome's "Build APK" button or this repo's Actions tab.
# Nothing runs on push, so your source repos spend no Actions minutes.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repo to build (owner/name)
        required: true
      ref:
        description: Branch, tag or commit (blank = default branch)
        required: false
        default: ''
      abi:
        description: arm64 builds for almost every phone and is fastest
        type: choice
        options: [arm64, all]
        default: arm64
      flutter:
        description: Flutter version (blank = the repo's .flutter-version or .fvmrc, else latest stable)
        required: false
        default: ''
      runner:
        description: Where to build (my-pc = the self-hosted runner labelled apk-builder)
        type: choice
        options: [github, my-pc]
        default: github

run-name: Build ${{ inputs.repo }} ${{ inputs.ref }} on ${{ inputs.runner || 'github' }}

# A new build of the same repo and branch cancels the one still running.
concurrency:
  group: build-${{ inputs.repo }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # publish the APKs as a release of this repo

defaults:
  run:
    shell: bash  # Git Bash on a Windows PC

jobs:
  build:
    # GitHub's Linux machines (1x minutes; free in public repos), or your
    # own PC's runner, which costs no minutes and keeps its caches.
    runs-on: ${{ inputs.runner == 'my-pc' && fromJSON('["self-hosted", "apk-builder"]') || 'ubuntu-latest' }}
    timeout-minutes: 25

    steps:
      - name: Check out ${{ inputs.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          # Public repos need no token; private ones need SOURCE_TOKEN.
          token: ${{ secrets.SOURCE_TOKEN || github.token }}
          path: src

      - name: Detect the project
        id: info
        working-directory: src
        env:
          REPO: ${{ inputs.repo }}
          FLUTTER_INPUT: ${{ inputs.flutter }}
        run: |
          if [ -f pubspec.yaml ]; then kind=flutter
          elif [ -f gradlew ]; then kind=gradle
          else
            echo "::error::$REPO has no pubspec.yaml or gradlew at its root."
            exit 1
          fi
          # Newer Flutter releases can reject an older project's Gradle, so
          # use the version the project asks for when it says one.
          fv="$FLUTTER_INPUT"
          if [ -z "$fv" ] && [ -f .flutter-version ]; then fv=$(tr -d ' \r\n' < .flutter-version); fi
          if [ -z "$fv" ] && [ -f .fvmrc ]; then
            fv=$(sed -nE 's/.*"flutter"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' .fvmrc | head -1)
          fi
          echo "flutter=$fv" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: inputs.runner != 'my-pc'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/**/gradle-wrapper.properties

      - name: Set up Flutter
        if: steps.info.outputs.kind == 'flutter' && inputs.runner != 'my-pc'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.info.outputs.flutter }}
          cache: true

      - name: Build (Flutter)
        if: steps.info.outputs.kind == 'flutter'
        working-directory: src
        env:
          ABI: ${{ inputs.abi }}
        run: |
          flutter pub get
          if [ "$ABI" = arm64 ]; then
            flutter build apk --release --split-per-abi --target-platform android-arm64
          else
            flutter build apk --release --split-per-abi
          fi

      - name: Build (Gradle)
        if: steps.info.outputs.kind == 'gradle'
        working-directory: src
        run: |
          sed -i 's/\r$//' gradlew  # Windows checkouts may add CRLF
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Every APK is signed with this repo's one key, so new builds install
      # as updates over older ones on your devices.
      - name: Collect and sign the APKs
        env:
          NAME: ${{ steps.info.outputs.name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir out
          find src -path '*/outputs/*' -name '*.apk' ! -name '*androidTest*' |
          while read -r f; do
            base=$(basename "$f" .apk); base=${base#app-}; base=${base%-unsigned}
            cp "$f" "out/$NAME-$base.apk"
          done
          if [ -z "$(ls out)" ]; then echo "::error::The build made no APK."; exit 1; fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > key.jks
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: using a throwaway key, so these APKs won't install as updates over earlier builds."
            KEYSTORE_PASSWORD=throwaway
            keytool -genkeypair -keystore key.jks -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" -alias key -keyalg RSA -validity 10000 \
              -dname "CN=APK builder" >/dev/null
          fi
          export KEYSTORE_PASSWORD
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if command -v cygpath >/dev/null; then sdk=$(cygpath -u "$sdk"); fi
          tools=$(ls -d "$sdk"/build-tools/* | sort -V | tail -1)
          zipalign="$tools/zipalign"; [ -f "$zipalign.exe" ] && zipalign="$zipalign.exe"
          apksigner="$tools/apksigner"; [ -f "$apksigner.bat" ] && apksigner="$apksigner.bat"
          for f in out/*.apk; do
            "$zipalign" -f -p 4 "$f" aligned.apk
            "$apksigner" sign --ks key.jks --ks-pass env:KEYSTORE_PASSWORD \
              --out "$f" aligned.apk
          done
          rm -f aligned.apk key.jks out/*.idsig
          ls -lh out

      # Tome's APKs page lists this release under the source repo,
      # titled "<name>:<run number>".
      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.name }}-${{ github.run_number }}
          name: ${{ steps.info.outputs.name }} build ${{ github.run_number }}
          make_latest: false
          body: |
            Built from ${{ inputs.repo }}@${{ steps.info.outputs.sha }} (${{ inputs.ref || 'default branch' }}).
          files: out/*.apk
