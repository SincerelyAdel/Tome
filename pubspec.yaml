name: tome
description: GitHub Repository Viewer with Claude AI integration

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  dio: ^5.4.3
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  archive: ^4.5.2
  open_filex: ^5.0.0
  flutter_markdown: 0.7.7+1
  markdown: 7.1.1
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
