name: Build Flutter APK

on:
  push:
    branches: [main, 'ccr-*']
  workflow_dispatch:

permissions:
  contents: write  # lets the job publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Write local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          echo "flutter.versionName=1.0" >> android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APKs
        run: |
          # One APK that runs on any phone (easiest to install by hand)...
          flutter build apk --release --no-shrink
          mv build/app/outputs/flutter-apk/app-release.apk RepoViewer.apk
          # ...plus smaller per-CPU APKs.
          flutter build apk --release --split-per-abi --no-shrink
          mv RepoViewer.apk build/app/outputs/flutter-apk/RepoViewer.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repoviewer-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # A release gives a direct .apk link that works on a phone without
      # signing in: https://github.com/<owner>/<repo>/releases/latest
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RepoViewer build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Built from `${{ github.ref_name }}` at ${{ github.sha }}.

            **On a phone:** download `RepoViewer.apk` below and open it.
          files: build/app/outputs/flutter-apk/*.apk
